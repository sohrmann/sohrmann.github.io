<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RIDEBUBS - Spin Studio Week Schedule at a Glance">
  <title>RIDEBUBS - Weekly Schedule</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🚴</text></svg>">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF6B35">
  
  <!-- Typography: Outfit for clean sans-serif headings/ui, JetBrains Mono for dates/times -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Unified Header & Control Panel -->
    <header class="app-header-controls" aria-label="App Navigation and Filters">
      <!-- Left side: Brand Logo and location -->
      <div class="brand-section">
        <h1 class="brand-logo" id="brand-logo">RIDE<span class="gradient-text">BUBS</span></h1>
        <span class="brand-subtitle">PRENZLAUER BERG</span>
      </div>

      <!-- Middle: Date display & Navigation buttons -->
      <div class="nav-section">
        <button id="btn-today" class="text-btn" aria-label="Go to Today">[ TODAY ]</button>
        <button id="btn-prev" class="text-btn" aria-label="Previous Week">[ PREV ]</button>
        <span class="date-range-display" id="date-range-display">Loading dates...</span>
        <button id="btn-next" class="text-btn" aria-label="Next Week">[ NEXT ]</button>
      </div>

    </header>

    <!-- Loading State -->
    <div id="loading-indicator" class="loading-state">
      <div class="spinner"></div>
      <p>[ FETCHING LATEST SESSIONS FROM THE STUDIO... ]</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="error-state hidden">
      <p class="error-msg">⚠️ Failed to load schedule. Please check your network connection.</p>
      <button id="btn-retry" class="retry-btn">[ RETRY FETCH ]</button>
    </div>

    <!-- Schedule Displays -->
    <main class="schedule-display-container">
      
      <!-- Columns Week View -->
      <div id="schedule-columns-view" class="schedule-columns-grid">
        <!-- 7 Columns generated by JS -->
      </div>



    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Data loaded live from RIDE.BLN booking system API.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
