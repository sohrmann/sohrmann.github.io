<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F162E"/>
      <stop offset="100%" stop-color="#04060E"/>
    </linearGradient>

    <!-- Cosmic Vibrant Gradient -->
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Front Ring Clip (Lower Half in rotated space) -->
    <clipPath id="frontClip">
      <rect x="-160" y="0" width="320" height="160"/>
    </clipPath>

    <!-- Back Ring Clip (Upper Half in rotated space) -->
    <clipPath id="backClip">
      <rect x="-160" y="-160" width="320" height="160"/>
    </clipPath>

    <!-- Mask to create clean negative gap around planet where ring passes behind -->
    <mask id="planetGapMask">
      <rect x="-160" y="-160" width="320" height="320" fill="white"/>
      <circle cx="0" cy="0" r="41" fill="black"/>
    </mask>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle ambient cosmic glow behind planet and dome -->
  <circle cx="256" cy="165" r="120" fill="#0284C7" opacity="0.12"/>
  <circle cx="256" cy="340" r="120" fill="#6366F1" opacity="0.09"/>

  <!-- Stars (Crisp 4-point diamond sparkles) -->
  <!-- Star 1: Top Right Gold (Jahreskarte!) -->
  <path d="M 380 115 Q 380 132 363 132 Q 380 132 380 149 Q 380 132 397 132 Q 380 132 380 115 Z" fill="#FBBF24"/>

  <!-- Star 2: Top Left Cyan -->
  <path d="M 132 136 Q 132 151 117 151 Q 132 151 132 166 Q 132 151 147 151 Q 132 151 132 136 Z" fill="#00F2FE" opacity="0.9"/>

  <!-- Tiny subtle celestial stars -->
  <circle cx="145" cy="245" r="3.5" fill="#CBD5E1" opacity="0.55"/>
  <circle cx="368" cy="238" r="3.5" fill="#CBD5E1" opacity="0.55"/>
  <circle cx="256" cy="72" r="2.5" fill="#94A3B8" opacity="0.5"/>

  <!-- Saturn Planet hovering above Dome (Centered at X=256, Y=165, rotated -22 deg) -->
  <g transform="translate(256, 165) rotate(-22)">
    <!-- Back Ring (masked with crisp gap behind planet) -->
    <g clip-path="url(#backClip)" mask="url(#planetGapMask)">
      <ellipse cx="0" cy="0" rx="75" ry="21" fill="none" stroke="url(#ringGrad)" stroke-width="8.5" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- Planet Sphere (radius 36) -->
    <circle cx="0" cy="0" r="36" fill="url(#cyanIndigo)"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

    <!-- Front Ring (in front of planet) -->
    <g clip-path="url(#frontClip)">
      <ellipse cx="0" cy="0" rx="75" ry="21" fill="none" stroke="url(#ringGrad)" stroke-width="8.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Projector Light Ray from Dome toward Planet -->
  <polygon points="248,290 264,290 292,205 220,205" fill="url(#cyanIndigo)" opacity="0.06"/>

  <!-- Zeiss Planetarium Dome Structure (Base line at Y=385) -->
  <g transform="translate(256, 385)">
    <!-- Foundation Base Plinth -->
    <rect x="-160" y="0" width="320" height="12" rx="6" fill="url(#cyanIndigo)"/>
    <rect x="-140" y="16" width="280" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>

    <!-- Main Outer Dome Shell -->
    <path d="M -132 0 A 132 132 0 0 1 132 0 Z" fill="#080C1E" stroke="url(#cyanIndigo)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Architectural Geodesic Ribs -->
    <path d="M -92 0 A 92 132 0 0 1 92 0" fill="none" stroke="url(#cyanIndigo)" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
    <path d="M -48 0 A 48 132 0 0 1 48 0" fill="none" stroke="url(#cyanIndigo)" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
    <line x1="0" y1="-132" x2="0" y2="0" stroke="url(#cyanIndigo)" stroke-width="5.5" opacity="0.75" stroke-linecap="round"/>

    <!-- Horizontal Dome Latitude Ring -->
    <path d="M -120 -54 Q 0 -92 120 -54" fill="none" stroke="url(#cyanIndigo)" stroke-width="5" opacity="0.6" stroke-linecap="round"/>

    <!-- Center Entrance / Portal -->
    <path d="M -22 0 L -22 -32 A 22 22 0 0 1 22 -32 L 22 0 Z" fill="url(#cyanIndigo)"/>
    <circle cx="0" cy="-16" r="5" fill="#080C1E"/>
  </g>
</svg>